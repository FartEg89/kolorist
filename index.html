<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Колорист">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<title>Кабинет колориста</title>
</head>
<body>
<header class="mast">
  <div class="brand"><img src="./icon-192.png" alt="" width="38" height="38"><span>Кабинет колориста</span></div>
  <span id="offline" class="local" role="status">На этом устройстве</span>
</header>
<main id="content" aria-busy="true"><p class="panel">Открываем записи…</p></main>
<nav id="tabs" aria-label="Разделы" hidden>
  <button data-tab="visit"><span aria-hidden="true">＋</span>Визит</button>
  <button data-tab="clients"><span aria-hidden="true">◎</span>Клиенты</button>
  <button data-tab="report"><span aria-hidden="true">▥</span>Итоги</button>
  <button data-tab="more"><span aria-hidden="true">···</span>Ещё</button>
</nav>
<dialog id="dialog" aria-labelledby="dialog-title">
  <header><h2 id="dialog-title"></h2><button id="close" type="button" aria-label="Закрыть">×</button></header>
  <div id="dialog-body"></div>
</dialog>
<div id="toast" hidden role="status"></div>
<noscript>Включите JavaScript в браузере, чтобы открыть кабинет.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
